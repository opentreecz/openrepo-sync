name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  automerge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # Auto-approve and merge patch and minor updates only.
      # Major updates require manual review.
      - name: Approve PR
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "${{ github.event.pull_request.number }}" --approve \
            --body "Auto-approved: ${{ steps.meta.outputs.update-type }}"

      # Wait for all CI checks on the PR to complete before merging.
      # --watch exits 0 when all required checks pass, non-zero on failure.
      - name: Wait for CI checks to pass
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checks "${{ github.event.pull_request.number }}" \
            --watch --interval 30 \
            --fail-fast
        timeout-minutes: 20

      - name: Merge PR
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --squash \
            --delete-branch \
            --subject "chore(deps): ${{ steps.meta.outputs.dependency-names }} ${{ steps.meta.outputs.updated-dependencies-versions }}"
