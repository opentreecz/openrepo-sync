[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
ignore = [
    # unsafe-libyaml is unmaintained (archived upstream 2024-03-25). It's a
    # transitive dep of serde_yaml, which we use for config files. No safe
    # upgrade exists — even serde_yaml's maintained forks (e.g. serde_yaml_ng)
    # still depend on it. Revisit if/when a safe-Rust YAML parser (saphyr,
    # serde-saphyr) is adopted.
    "RUSTSEC-2024-0449",
    # RUSTSEC-2026-0386 (tokio AsyncFd I/O-safety advisory) previously ignored
    # here no longer matches anything as of tokio 1.54.1 — removed rather than
    # left as a dangling, cargo-deny-warns-about-it entry.
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
