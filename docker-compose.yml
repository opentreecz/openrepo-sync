services:
  openrepo-sync:
    image: ghcr.io/opentreecz/openrepo-sync:latest
    build:
      context: .
      dockerfile: Dockerfile.build
    volumes:
      - ./config.yaml:/config.yaml:ro,z
      - ./projects:/projects:ro,z
    environment:
      - OPENREPO_API_KEY=${OPENREPO_API_KEY}
    command: ["--schedule", "--config", "/config.yaml", "--projects", "/projects"]
    restart: unless-stopped
