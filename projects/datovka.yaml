# Datovka from CZ.NIC's OBS repository.
#
# This repository uses the OBS flat APT layout: Packages/Packages.gz live at
# the repository root instead of dists/<suite>/<component>/binary-<arch>/.
---
name: datovka
repo_uid: deb
keep_versions: 3
on_conflict: skip

source:
  type: deb_repo
  layout: flat
  url: https://download.opensuse.org/repositories/home:/CZ-NIC:/datovka-latest/Debian_13
  package_filter: datovka
  filename_filter: "datovka_*_amd64.deb"
  verify_gpg: true
  gpg_key: https://download.opensuse.org/repositories/home:/CZ-NIC:/datovka-latest/Debian_13/Release.key
