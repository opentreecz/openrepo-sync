---
name: docker-ce
repo_uid: deb
keep_versions: 3
on_conflict: skip

source:
  type: deb_repo
  url: https://download.docker.com/linux/debian
  suites: bookworm
  components: stable
  architectures: amd64
  package_filter: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
  verify_gpg: true
  gpg_key: https://download.docker.com/linux/debian/gpg
